CONFIG_MAIN_STACK_SIZE=1024
CONFIG_SHELL=y
CONFIG_SERIAL=y
CONFIG_GPIO=y
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_BUFFER_SIZE=512

# SPI + nRF24L01P
CONFIG_SPI=y
CONFIG_NRF24L01P=y
CONFIG_NRF24L01P_INT_THREAD_STACK_SIZE=2048

# SPI Flash (MCUBoot)
CONFIG_FLASH=y
CONFIG_SPI_NOR_SFDP_MINIMAL=n
CONFIG_SPI_NOR_FLASH_LAYOUT_PAGE_SIZE=4096
CONFIG_FLASH_MAP=y
CONFIG_IMG_MANAGER=y
CONFIG_STREAM_FLASH=y
CONFIG_REBOOT=y

# CRC
CONFIG_CRC=y

# UDP firmware upgrade library (self-contained: owns config port 9200)
CONFIG_UDP_FW_UPGRADE=y
CONFIG_UDP_FW_RX_STACK_SIZE=2048

# Settings persistent storage
CONFIG_SETTINGS=y
CONFIG_SETTINGS_RUNTIME=y
CONFIG_FCB=y

# Networking
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_POSIX_API=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_ARP=y
CONFIG_NET_MGMT=y         /* 网络管理子系统; NET_MGMT_EVENT depends on 它 (非 select, 必须显式开) */
CONFIG_NET_MGMT_EVENT=y   /* 网络事件回调 (NET_EVENT_IF_UP 等) */
CONFIG_TEST_RANDOM_GENERATOR=y
