# log
CONFIG_LOG=y
CONFIG_LOG_BUFFER_SIZE=1024
CONFIG_LOG_OUTPUT_FORMAT_DATE_TIMESTAMP=y

CONFIG_POSIX_API=y
CONFIG_MAIN_STACK_SIZE=2048

# libc: 应用不使用 malloc（ftp_server 改用 k_mem_slab），关闭 heap arena
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=0

# modbus
CONFIG_MODBUS=y
CONFIG_MODBUS_ROLE_SERVER=y
CONFIG_MODBUS_RAW_ADU=y
CONFIG_MODBUS_NUMOF_RAW_ADU=1
CONFIG_MODBUS_ROLE_SERVER=y

# adc
CONFIG_ADC=y

# CAN firmware upgrade library (self-contained: owns CAN controller + RX thread)
CONFIG_CAN_FW_UPGRADE=y
CONFIG_CAN_FW_UPGRADE_RX_STACK_SIZE=1024

# UDP firmware upgrade library (self-contained: owns config port, default 8600)
CONFIG_UDP_FW_UPGRADE=y
CONFIG_UDP_FW_RX_STACK_SIZE=1536

# Networking config
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_MAX_CONN=15
CONFIG_NET_MAX_CONTEXTS=15
CONFIG_ZVFS_POLL_MAX=20
CONFIG_NET_BUF_DATA_SIZE=512
CONFIG_NET_BUF_RX_COUNT=8
CONFIG_NET_BUF_TX_COUNT=8
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_DHCPV4=y
CONFIG_EVENTS=y

# settings
CONFIG_FCB=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_RUNTIME=y

# flash / MCUBoot (firmware upgrade images, UDP/CAN fw libs)
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_IMG_MANAGER=y
CONFIG_STREAM_FLASH=y
CONFIG_REBOOT=y
CONFIG_BOOTLOADER_MCUBOOT=y

# CRC (UDP fw image crc) + entropy
CONFIG_CRC=y
CONFIG_ENTROPY_GENERATOR=y

CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

