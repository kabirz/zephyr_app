CONFIG_MAIN_STACK_SIZE=2048
CONFIG_LOG=y

# native_sim 网络: nsos socket offload.
# native_sim 用 NATIVE_LIBC(主机 glibc), socket() 会落到主机 glibc 绕过 Zephyr 网络栈;
# nsos offload 让 socket() 走 Zephyr offload dispatcher→主机网络 (echo_server native_sim 同方案).
CONFIG_ETH_NATIVE_TAP=n
CONFIG_NET_DRIVERS=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_NET_NATIVE_OFFLOADED_SOCKETS=y

# 网络栈
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_POSIX_API=y
CONFIG_POSIX_NETWORKING=y  # 启用 Zephyr socket() (否则 native_sim 链接主机 glibc socket)
CONFIG_NET_ARP=y

# 链路事件等待 (NET_EVENT_IF_UP, 与 gateway 一致)
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y

# RNG (native_sim 无硬件 RNG)
CONFIG_TEST_RANDOM_GENERATOR=y

# sys_reboot (REBOOT 命令 + 固件升级 FW_END 重启)
CONFIG_REBOOT=y

# 调试: 定位 socket errno 93 (临时, 定位后移除)
CONFIG_NET_LOG=y
CONFIG_NET_CONTEXT_LOG_LEVEL_DBG=y
CONFIG_NET_SOCKETS_LOG_LEVEL_DBG=y
