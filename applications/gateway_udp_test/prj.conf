CONFIG_MAIN_STACK_SIZE=2048

# shell
CONFIG_SHELL=y
CONFIG_SERIAL=y
CONFIG_GPIO=y
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_LOG_BLOCK_IN_THREAD=y

# Networking
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_POSIX_API=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_ARP=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_DHCPV4=y       /* DHCP 客户端 (静态/DHCP 模式切换) */
CONFIG_NET_STATISTICS=y

# Entropy (STM32F407 硬件 RNG)
CONFIG_ENTROPY_GENERATOR=y

# SPI Flash (W25Q128, MCUBoot slot1/scratch + cfg 分区)
CONFIG_FLASH=y
CONFIG_SPI=y
CONFIG_SPI_NOR_SFDP_MINIMAL=n
CONFIG_SPI_NOR_FLASH_LAYOUT_PAGE_SIZE=4096
CONFIG_FLASH_MAP=y
CONFIG_IMG_MANAGER=y
CONFIG_STREAM_FLASH=y
CONFIG_REBOOT=y

# CRC
CONFIG_CRC=y

# UDP firmware upgrade library (self-contained: owns config port 9200)
CONFIG_UDP_FW_UPGRADE=y
CONFIG_UDP_FW_RX_STACK_SIZE=1536

# Settings persistent storage (FCB backend, cfg_partition)
CONFIG_SETTINGS=y
CONFIG_SETTINGS_RUNTIME=y
CONFIG_FCB=y

# MCUBoot bootutil (image info)
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_NET_PKT_RX_COUNT=4
CONFIG_NET_PKT_TX_COUNT=4
CONFIG_NET_BUF_RX_COUNT=8
CONFIG_NET_BUF_TX_COUNT=8
# 固件升级 512B 包需 4 个 buf, 8 个够; DATA_SIZE 保持默认 128
CONFIG_NET_BUF_DATA_SIZE=128
# 2 socket + DHCP 占 1, 4 足够
CONFIG_NET_MAX_CONN=4
CONFIG_TEST_RANDOM_GENERATOR=y
