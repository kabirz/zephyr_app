CONFIG_MAIN_STACK_SIZE=2048

# shell
CONFIG_SHELL=y
CONFIG_SERIAL=y
CONFIG_GPIO=y
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_BUFFER_SIZE=512

# Networking
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_UDP=y
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_POSIX_API=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_ARP=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_STATISTICS=y

# zperf 带宽测试库 (提供 zperf shell 命令, 配合 PC 端 iperf2 使用)
# zperf shell 注册依赖 NET_SHELL (否则 zperf_shell.c 不编译, 无 zperf 命令)
CONFIG_NET_ZPERF=y
CONFIG_NET_ZPERF_SERVER=y
CONFIG_NET_SHELL=y

# 网络缓冲池 (吞吐关键, 但 STM32F407 RAM 有限需平衡; 默认值偏小限制带宽)
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=64
CONFIG_NET_BUF_TX_COUNT=64
CONFIG_NET_BUF_DATA_SIZE=256
CONFIG_NET_MAX_CONTEXTS=5
CONFIG_NET_TC_TX_COUNT=1

# 性能优化 (-O2, 默认 -Os 偏重体积)
CONFIG_SPEED_OPTIMIZATIONS=y

# Entropy (STM32F407 硬件 RNG)
CONFIG_ENTROPY_GENERATOR=y

# SPI Flash (W25Q128, MCUBoot slot1/scratch + cfg 分区)
CONFIG_FLASH=y
CONFIG_SPI=y
CONFIG_SPI_NOR_SFDP_MINIMAL=n
CONFIG_SPI_NOR_FLASH_LAYOUT_PAGE_SIZE=4096
CONFIG_FLASH_MAP=y
CONFIG_IMG_MANAGER=y
CONFIG_STREAM_FLASH=y
CONFIG_REBOOT=y

# CRC
CONFIG_CRC=y

# UDP firmware upgrade library (self-contained: owns config port 9200)
CONFIG_UDP_FW_UPGRADE=y

# Settings persistent storage (FCB backend, cfg_partition)
CONFIG_SETTINGS=y
CONFIG_SETTINGS_RUNTIME=y
CONFIG_FCB=y

# MCUBoot bootutil (image info)
CONFIG_BOOTLOADER_MCUBOOT=y
